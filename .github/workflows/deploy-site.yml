name: Deploy site

on:
  # push:
  #   branches: [main]
  #   paths:
  #     - "site/**"
  #     - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - name: Install
        run: bun install
      - name: Build (static, GitHub Pages subpath)
        # Project Pages serve from /<repo>/ — derive BASE_PATH from the repo name.
        run: BASE_PATH=/${GITHUB_REPOSITORY#*/}/ bun run build
      - name: SPA fallback for unknown deep links
        run: cp build/client/index.html build/client/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/build/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
