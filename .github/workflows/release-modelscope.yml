name: Release platform to ModelScope

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*.*.*-*"
      - "unibuddy-v*.*.*"
      - "!unibuddy-v*.*.*-*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z or unibuddy-vX.Y.Z tag (builds Windows, macOS, and Linux)
        required: true
        type: string

permissions:
  contents: read

# One release tag runs all platforms; do not cancel a sibling platform mid-upload.
concurrency:
  group: modelscope-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  BUN_VERSION: "1.3.13"
  PYTHON_VERSION: "3.12"
  UPLOAD_RETRIES: "5"
  UPLOAD_RETRY_BASE_SEC: "30"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: "sparse"

jobs:
  release-context:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      profile: ${{ steps.release.outputs.profile }}
      product_name: ${{ steps.release.outputs.product_name }}
      product_config: ${{ steps.release.outputs.product_config }}
      channel_root: ${{ steps.release.outputs.channel_root }}
      windows_channel_config: ${{ steps.release.outputs.windows_channel_config }}
      macos_channel_config: ${{ steps.release.outputs.macos_channel_config }}
      linux_channel_config: ${{ steps.release.outputs.linux_channel_config }}
      publish_github: ${{ steps.release.outputs.publish_github }}
    steps:
      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$MANUAL_TAG"
          else
            tag="$PUSH_TAG"
          fi
          # Accept the Flowy and UniBuddy release families; reject prerelease and
          # legacy per-platform suffixes before checking out arbitrary refs.
          if [[ ! "$tag" =~ ^(unibuddy-)?v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $tag (expected vX.Y.Z or unibuddy-vX.Y.Z)" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Verify tag and workspace version
        id: release
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [[ "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
            profile="flowy"
            product_name="Flowy"
            product_config=""
            channel_root="channels"
            windows_channel_config="apps/desktop/tauri.channel.windows.conf.json"
            macos_channel_config="apps/desktop/tauri.channel.macos.conf.json"
            linux_channel_config="apps/desktop/tauri.channel.linux.conf.json"
            publish_github="true"
          elif [[ "$RELEASE_TAG" =~ ^unibuddy-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
            profile="unibuddy"
            product_name="UniBuddy"
            product_config="apps/desktop/tauri.unibuddy.conf.json"
            channel_root="unibuddy_channels"
            windows_channel_config="apps/desktop/tauri.channel.unibuddy.windows.conf.json"
            macos_channel_config="apps/desktop/tauri.channel.unibuddy.macos.conf.json"
            linux_channel_config="apps/desktop/tauri.channel.unibuddy.linux.conf.json"
            publish_github="false"
          else
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          git_tag="$(git describe --tags --exact-match --match "$RELEASE_TAG")"
          if [[ "$git_tag" != "$RELEASE_TAG" ]]; then
            echo "Checked-out tag $git_tag does not match requested tag $RELEASE_TAG" >&2
            exit 1
          fi

          workspace_version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ -z "$workspace_version" || "$workspace_version" != "$version" ]]; then
            echo "Tag version $version does not match Cargo.toml version ${workspace_version:-<missing>}" >&2
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "product_name=$product_name" >> "$GITHUB_OUTPUT"
          echo "product_config=$product_config" >> "$GITHUB_OUTPUT"
          echo "channel_root=$channel_root" >> "$GITHUB_OUTPUT"
          echo "windows_channel_config=$windows_channel_config" >> "$GITHUB_OUTPUT"
          echo "macos_channel_config=$macos_channel_config" >> "$GITHUB_OUTPUT"
          echo "linux_channel_config=$linux_channel_config" >> "$GITHUB_OUTPUT"
          echo "publish_github=$publish_github" >> "$GITHUB_OUTPUT"

  # ui/dist is platform-independent; build once on a 16GB runner, reuse on Win/macOS/Linux.
  build-ui:
    name: Build SPA
    needs: release-context
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-context.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build UI
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          RELEASE_PROFILE: ${{ needs.release-context.outputs.profile }}
        run: |
          if [[ "$RELEASE_PROFILE" == "unibuddy" ]]; then
            bun run --filter=./ui build --mode unibuddy
          else
            bun run build:ui
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 3
          if-no-files-found: error

  # ── Windows: build x64 and arm64 in parallel (no shared output) ───────────
  build-windows:
    name: Build Windows (${{ matrix.arch }})
    needs: [release-context, build-ui]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            artifact_name: windows-x64-dist
          - arch: arm64
            runner: windows-11-arm
            rust_targets: aarch64-pc-windows-msvc
            artifact_name: windows-arm64-dist
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-context.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Use crates.io from GitHub
        run: bun scripts/ci-use-crates-io.mjs

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-${{ matrix.arch }}-${{ needs.release-context.outputs.profile }}-updater
          workspaces: ". -> build.noindex"
          cache-on-failure: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v7
        with:
          name: ui-dist
          path: ui/dist

      - name: Build Windows updater (${{ matrix.arch }})
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PRODUCT_NAME: ${{ needs.release-context.outputs.product_name }}
          PRODUCT_CONFIG: ${{ needs.release-context.outputs.product_config }}
          CHANNEL_CONFIG: ${{ needs.release-context.outputs.windows_channel_config }}
          CHANNEL_ROOT: ${{ needs.release-context.outputs.channel_root }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw 'TAURI_SIGNING_PRIVATE_KEY is not configured'
          }
          if ($env:PRODUCT_CONFIG) {
            bun run build:win ${{ matrix.arch }} `
              --config $env:PRODUCT_CONFIG `
              --config apps/desktop/tauri.updater.conf.json `
              --config $env:CHANNEL_CONFIG `
              --config apps/desktop/tauri.ci-skip-ui.conf.json
          } else {
            bun run build:win ${{ matrix.arch }} `
              --config apps/desktop/tauri.updater.conf.json `
              --config $env:CHANNEL_CONFIG `
              --config apps/desktop/tauri.ci-skip-ui.conf.json
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run verify:voice-package -- --platform windows --arch ${{ matrix.arch }} --dist dist/desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run make:latest --host modelscope --channel windows `
            --product $env:PRODUCT_NAME --channel-root $env:CHANNEL_ROOT --collect
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/desktop/
          retention-days: 3
          if-no-files-found: error

  publish-windows:
    name: Publish Windows channel
    needs: [release-context, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: modelscope-alpha
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-context.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install upload deps
        run: |
          bun install --frozen-lockfile
          UV_SYSTEM_PYTHON=1 uv pip install --python "${{ env.PYTHON_VERSION }}" -r scripts/requirements-modelscope.txt

      - uses: actions/download-artifact@v7
        with:
          name: windows-x64-dist
          path: staging/windows-x64

      - uses: actions/download-artifact@v7
        with:
          name: windows-arm64-dist
          path: staging/windows-arm64

      - name: Merge Windows dist and refresh manifest
        env:
          PRODUCT_NAME: ${{ needs.release-context.outputs.product_name }}
          CHANNEL_ROOT: ${{ needs.release-context.outputs.channel_root }}
        run: |
          mkdir -p dist/desktop
          cp -a staging/windows-x64/. dist/desktop/
          cp -a staging/windows-arm64/. dist/desktop/
          bun run make:latest --host modelscope --channel windows \
            --product "$PRODUCT_NAME" --channel-root "$CHANNEL_ROOT" \
            --from-dir dist/desktop --collect
          ls -lah dist/desktop

      - name: Upload Windows artifacts to ModelScope CN (phase 1)
        env:
          MODELSCOPE_CN_TOKEN: ${{ secrets.MODELSCOPE_CN_TOKEN }}
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
          CHANNEL_ROOT: ${{ needs.release-context.outputs.channel_root }}
        run: |
          test -n "${MODELSCOPE_CN_TOKEN:-${MODELSCOPE_TOKEN:-}}" || {
            echo "MODELSCOPE_CN_TOKEN is not configured" >&2
            exit 1
          }
          bun scripts/run-upload-modelscope.mjs \
            --dist-dir dist/desktop/ \
            --channel windows \
            --channel-root "$CHANNEL_ROOT" \
            --api-host modelscope.cn \
            --repo flowy2025/flowyaipc \
            --token-env MODELSCOPE_CN_TOKEN \
            --artifacts-only \
            --retries "$UPLOAD_RETRIES" \
            --retry-base-sec "$UPLOAD_RETRY_BASE_SEC"

      - name: Publish Windows channel pointer on ModelScope CN (phase 2)
        env:
          MODELSCOPE_CN_TOKEN: ${{ secrets.MODELSCOPE_CN_TOKEN }}
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
          CHANNEL_ROOT: ${{ needs.release-context.outputs.channel_root }}
        run: |
          bun scripts/run-upload-modelscope.mjs \
            --dist-dir dist/desktop/ \
            --channel windows \
            --channel-root "$CHANNEL_ROOT" \
            --api-host modelscope.cn \
            --repo flowy2025/flowyaipc \
            --token-env MODELSCOPE_CN_TOKEN \
            --manifest-only \
            --retries "$UPLOAD_RETRIES" \
            --retry-base-sec "$UPLOAD_RETRY_BASE_SEC"

      - name: Verify Windows channel on ModelScope CN
        env:
          EXPECTED_VERSION: ${{ needs.release-context.outputs.version }}
          CHANNEL_ROOT: ${{ needs.release-context.outputs.channel_root }}
        run: |
          python scripts/verify-modelscope-release.py \
            --channel windows \
            --channel-root "$CHANNEL_ROOT" \
            --api-host modelscope.cn \
            --repo flowy2025/flowyaipc \
            --version "$EXPECTED_VERSION" \
            --platform windows-x86_64 \
            --platform windows-aarch64 \
            --check-artifacts \
            --metadata dist/desktop/release-metadata.json

      - name: Upload Windows artifacts to ModelScope AI (phase 1)
        env:
          MODELSCOPE_AI_TOKEN: ${{ secrets.MODELSCOPE_AI_TOKEN }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
          CHANNEL_ROOT: ${{ needs.release-context.outputs.channel_root }}
        run: |
          test -n "$MODELSCOPE_AI_TOKEN" || {
            echo "MODELSCOPE_AI_TOKEN is not configured" >&2
            exit 1
          }
          bun scripts/run-upload-modelscope.mjs \
            --dist-dir dist/desktop/ \
            --channel windows \
            --channel-root "$CHANNEL_ROOT" \
            --api-host modelscope.ai \
            --repo flowy2025/flowy \
            --token-env MODELSCOPE_AI_TOKEN \
            --artifacts-only \
            --retries "$UPLOAD_RETRIES" \
            --retry-base-sec "$UPLOAD_RETRY_BASE_SEC"

      - name: Publish Windows channel pointer on ModelScope AI (phase 2)
        env:
          MODELSCOPE_AI_TOKEN: ${{ secrets.MODELSCOPE_AI_TOKEN }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
          CHANNEL_ROOT: ${{ needs.release-context.outputs.channel_root }}
        run: |
          bun scripts/run-upload-modelscope.mjs \
            --dist-dir dist/desktop/ \
            --channel windows \
            --channel-root "$CHANNEL_ROOT" \
            --api-host modelscope.ai \
            --repo flowy2025/flowy \
            --token-env MODELSCOPE_AI_TOKEN \
            --manifest-only \
            --retries "$UPLOAD_RETRIES" \
            --retry-base-sec "$UPLOAD_RETRY_BASE_SEC"

      - name: Verify Windows channel on ModelScope AI
        env:
          EXPECTED_VERSION: ${{ needs.release-context.outputs.version }}
          CHANNEL_ROOT: ${{ needs.release-context.outputs.channel_root }}
        run: |
          python scripts/verify-modelscope-release.py \
            --channel windows \
            --channel-root "$CHANNEL_ROOT" \
            --api-host modelscope.ai \
            --repo flowy2025/flowy \
            --version "$EXPECTED_VERSION" \
            --platform windows-x86_64 \
            --platform windows-aarch64 \
            --check-artifacts \
            --metadata dist/desktop/release-metadata.json

      - name: Upload Windows artifacts to GitHub Release
        if: needs.release-context.outputs.publish_github == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-github-ota.sh "${{ needs.release-context.outputs.tag }}" windows dist/desktop

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-release-metadata
          path: |
            dist/desktop/latest.json
            dist/desktop/channel.yml
            dist/desktop/release-metadata.json
          retention-days: 30
          if-no-files-found: warn

  # Native slice per chip, then lipo on the job that waits for the slower slice.
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    needs: [release-context, build-ui]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
            build_arch: arm
            artifact_name: macos-arm64-app
            macho_arch: arm64
          - arch: intel
            # Same macos-15 pool as arm64 (cross-compile x86_64). macos-15-intel
            # is scarce and queued ~1h on v1.2.7, blowing out wall clock.
            runner: macos-15
            rust_target: x86_64-apple-darwin
            build_arch: intel
            artifact_name: macos-intel-app
            macho_arch: x86_64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-context.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Use crates.io from GitHub
        run: bun scripts/ci-use-crates-io.mjs

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-${{ matrix.arch }}-${{ needs.release-context.outputs.profile }}-updater
          workspaces: ". -> build.noindex"
          cache-on-failure: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v7
        with:
          name: ui-dist
          path: ui/dist

      - name: Build macOS ${{ matrix.arch }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PRODUCT_NAME: ${{ needs.release-context.outputs.product_name }}
          PRODUCT_CONFIG: ${{ needs.release-context.outputs.product_config }}
          CHANNEL_CONFIG: ${{ needs.release-context.outputs.macos_channel_config }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "TAURI_SIGNING_PRIVATE_KEY is not configured" >&2
            exit 1
          }
          product_config_args=()
          if [[ -n "$PRODUCT_CONFIG" ]]; then
            product_config_args=(--config "$PRODUCT_CONFIG")
          fi
          bun run build:mac ${{ matrix.build_arch }} \
            "${product_config_args[@]}" \
            --config apps/desktop/tauri.updater.conf.json \
            --config "$CHANNEL_CONFIG" \
            --config apps/desktop/tauri.ci-skip-ui.conf.json
          app_path="target/${{ matrix.rust_target }}/release/bundle/macos/${PRODUCT_NAME}.app"
          test -d "$app_path"
          # Catch host-arch resource sidecars before the merge job (cross-compile
          # on macos-15 must ship x86_64 rg for the intel slice).
          lipo -archs "$app_path/Contents/MacOS/$PRODUCT_NAME" \
            | grep -qw "${{ matrix.macho_arch }}"
          if [[ -f "$app_path/Contents/Resources/bin/rg" ]]; then
            [[ "$(lipo -archs "$app_path/Contents/Resources/bin/rg")" == "${{ matrix.macho_arch }}" ]]
          fi
          bun run verify:voice-package -- --platform macos --arch ${{ matrix.macho_arch }} --dist dist/desktop
          ditto -c -k --keepParent "$app_path" desktop-app.zip

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: desktop-app.zip
          retention-days: 3
          if-no-files-found: error

  merge-macos:
    name: Merge macOS universal
    needs: [release-context, build-macos]
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-context.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v7
        with:
          name: macos-arm64-app
          path: staging/arm64

      - uses: actions/download-artifact@v7
        with:
          name: macos-intel-app
          path: staging/intel

      - name: Unpack slice apps
        run: |
          ditto -x -k staging/arm64/desktop-app.zip staging/arm64
          ditto -x -k staging/intel/desktop-app.zip staging/intel

      - name: Lipo universal app, DMG, and updater archive
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PRODUCT_NAME: ${{ needs.release-context.outputs.product_name }}
          CHANNEL_ROOT: ${{ needs.release-context.outputs.channel_root }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "TAURI_SIGNING_PRIVATE_KEY is not configured" >&2
            exit 1
          }
          bash scripts/merge-macos-universal.sh \
            --arm64 staging/arm64 \
            --intel staging/intel \
            --version "${{ needs.release-context.outputs.version }}" \
            --product "$PRODUCT_NAME" \
            --binary "$PRODUCT_NAME"
          bun run verify:voice-package -- --platform macos --arch universal \
            --artifact "target/universal-apple-darwin/release/bundle/macos/${PRODUCT_NAME}.app"
          bun run make:latest --host modelscope --channel macos \
            --product "$PRODUCT_NAME" --channel-root "$CHANNEL_ROOT" --collect

      - uses: actions/upload-artifact@v7
        with:
          name: macos-dist
          path: dist/desktop/
          retention-days: 3
          if-no-files-found: error

  publish-macos:
    name: Publish macOS channel
    needs: [release-context, merge-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: modelscope-alpha
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-context.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install upload deps
        run: |
          bun install --frozen-lockfile
          UV_SYSTEM_PYTHON=1 uv pip install --python "${{ env.PYTHON_VERSION }}" -r scripts/requirements-modelscope.txt

      - uses: actions/download-artifact@v7
        with:
          name: macos-dist
          path: dist/desktop

      - name: Upload macOS artifacts to ModelScope CN (phase 1)
        env:
          MODELSCOPE_CN_TOKEN: ${{ secrets.MODELSCOPE_CN_TOKEN }}
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          CHANNEL_ROOT: ${{ needs.release-context.outputs.channel_root }}
        run: |
          test -n "${MODELSCOPE_CN_TOKEN:-${MODELSCOPE_TOKEN:-}}" || {
            echo "MODELSCOPE_CN_TOKEN is not configured" >&2
            exit 1
          }
          bun scripts/run-upload-modelscope.mjs \
            --dist-dir dist/desktop/ \
            --channel macos \
            --channel-root "$CHANNEL_ROOT" \
            --api-host modelscope.cn \
            --repo flowy2025/flowyaipc \
            --token-env MODELSCOPE_CN_TOKEN \
            --artifacts-only \
            --retries "$UPLOAD_RETRIES" \
            --retry-base-sec "$UPLOAD_RETRY_BASE_SEC"

      - name: Publish macOS channel pointer on ModelScope CN (phase 2)
        env:
          MODELSCOPE_CN_TOKEN: ${{ secrets.MODELSCOPE_CN_TOKEN }}
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          CHANNEL_ROOT: ${{ needs.release-context.outputs.channel_root }}
        run: |
          bun scripts/run-upload-modelscope.mjs \
            --dist-dir dist/desktop/ \
            --channel macos \
            --channel-root "$CHANNEL_ROOT" \
            --api-host modelscope.cn \
            --repo flowy2025/flowyaipc \
            --token-env MODELSCOPE_CN_TOKEN \
            --manifest-only \
            --retries "$UPLOAD_RETRIES" \
            --retry-base-sec "$UPLOAD_RETRY_BASE_SEC"

      - name: Verify macOS channel on ModelScope CN
        env:
          EXPECTED_VERSION: ${{ needs.release-context.outputs.version }}
          CHANNEL_ROOT: ${{ needs.release-context.outputs.channel_root }}
        run: |
          python scripts/verify-modelscope-release.py \
            --channel macos \
            --channel-root "$CHANNEL_ROOT" \
            --api-host modelscope.cn \
            --repo flowy2025/flowyaipc \
            --version "$EXPECTED_VERSION" \
            --platform darwin-aarch64 \
            --platform darwin-x86_64 \
            --check-artifacts \
            --metadata dist/desktop/release-metadata.json

      - name: Upload macOS artifacts to ModelScope AI (phase 1)
        env:
          MODELSCOPE_AI_TOKEN: ${{ secrets.MODELSCOPE_AI_TOKEN }}
          CHANNEL_ROOT: ${{ needs.release-context.outputs.channel_root }}
        run: |
          test -n "$MODELSCOPE_AI_TOKEN" || {
            echo "MODELSCOPE_AI_TOKEN is not configured" >&2
            exit 1
          }
          bun scripts/run-upload-modelscope.mjs \
            --dist-dir dist/desktop/ \
            --channel macos \
            --channel-root "$CHANNEL_ROOT" \
            --api-host modelscope.ai \
            --repo flowy2025/flowy \
            --token-env MODELSCOPE_AI_TOKEN \
            --artifacts-only \
            --retries "$UPLOAD_RETRIES" \
            --retry-base-sec "$UPLOAD_RETRY_BASE_SEC"

      - name: Publish macOS channel pointer on ModelScope AI (phase 2)
        env:
          MODELSCOPE_AI_TOKEN: ${{ secrets.MODELSCOPE_AI_TOKEN }}
          CHANNEL_ROOT: ${{ needs.release-context.outputs.channel_root }}
        run: |
          bun scripts/run-upload-modelscope.mjs \
            --dist-dir dist/desktop/ \
            --channel macos \
            --channel-root "$CHANNEL_ROOT" \
            --api-host modelscope.ai \
            --repo flowy2025/flowy \
            --token-env MODELSCOPE_AI_TOKEN \
            --manifest-only \
            --retries "$UPLOAD_RETRIES" \
            --retry-base-sec "$UPLOAD_RETRY_BASE_SEC"

      - name: Verify macOS channel on ModelScope AI
        env:
          EXPECTED_VERSION: ${{ needs.release-context.outputs.version }}
          CHANNEL_ROOT: ${{ needs.release-context.outputs.channel_root }}
        run: |
          python scripts/verify-modelscope-release.py \
            --channel macos \
            --channel-root "$CHANNEL_ROOT" \
            --api-host modelscope.ai \
            --repo flowy2025/flowy \
            --version "$EXPECTED_VERSION" \
            --platform darwin-aarch64 \
            --platform darwin-x86_64 \
            --check-artifacts \
            --metadata dist/desktop/release-metadata.json

      - name: Upload macOS artifacts to GitHub Release
        if: needs.release-context.outputs.publish_github == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-github-ota.sh "${{ needs.release-context.outputs.tag }}" macos dist/desktop

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-release-metadata
          path: |
            dist/desktop/latest.json
            dist/desktop/channel.yml
            dist/desktop/release-metadata.json
          retention-days: 30
          if-no-files-found: warn

  # ── Linux: build x64 and arm64 in parallel (native; no cross-compile) ─────
  build-linux:
    name: Build Linux (${{ matrix.arch }})
    needs: [release-context, build-ui]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            rust_targets: x86_64-unknown-linux-gnu
            artifact_name: linux-x64-dist
          - arch: arm64
            runner: ubuntu-24.04-arm
            rust_targets: aarch64-unknown-linux-gnu
            artifact_name: linux-arm64-dist
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-context.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Use crates.io from GitHub
        run: bun scripts/ci-use-crates-io.mjs

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-${{ matrix.arch }}-${{ needs.release-context.outputs.profile }}-updater
          workspaces: ". -> build.noindex"
          cache-on-failure: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libpipewire-0.3-dev \
            libgbm-dev \
            libclang-dev \
            librsvg2-dev \
            libasound2-dev \
            squashfs-tools \
            7zip \
            xdg-utils

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v7
        with:
          name: ui-dist
          path: ui/dist

      - name: Build Linux updater (${{ matrix.arch }})
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PRODUCT_NAME: ${{ needs.release-context.outputs.product_name }}
          PRODUCT_CONFIG: ${{ needs.release-context.outputs.product_config }}
          CHANNEL_CONFIG: ${{ needs.release-context.outputs.linux_channel_config }}
          CHANNEL_ROOT: ${{ needs.release-context.outputs.channel_root }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "TAURI_SIGNING_PRIVATE_KEY is not configured" >&2
            exit 1
          }
          product_config_args=()
          if [[ -n "$PRODUCT_CONFIG" ]]; then
            product_config_args=(--config "$PRODUCT_CONFIG")
          fi
          bun run build:linux ${{ matrix.arch }} \
            "${product_config_args[@]}" \
            --config apps/desktop/tauri.updater.conf.json \
            --config "$CHANNEL_CONFIG" \
            --config apps/desktop/tauri.ci-skip-ui.conf.json
          bun run verify:voice-package -- --platform linux --arch ${{ matrix.arch }} --dist dist/desktop
          bun run make:latest --host modelscope --channel linux \
            --product "$PRODUCT_NAME" --channel-root "$CHANNEL_ROOT" --collect

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/desktop/
          retention-days: 3
          if-no-files-found: error

  publish-linux:
    name: Publish Linux channel
    needs: [release-context, build-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: modelscope-alpha
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-context.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install upload deps
        run: |
          bun install --frozen-lockfile
          UV_SYSTEM_PYTHON=1 uv pip install --python "${{ env.PYTHON_VERSION }}" -r scripts/requirements-modelscope.txt

      - uses: actions/download-artifact@v7
        with:
          name: linux-x64-dist
          path: staging/linux-x64

      - uses: actions/download-artifact@v7
        with:
          name: linux-arm64-dist
          path: staging/linux-arm64

      - name: Merge Linux dist and refresh manifest
        env:
          PRODUCT_NAME: ${{ needs.release-context.outputs.product_name }}
          CHANNEL_ROOT: ${{ needs.release-context.outputs.channel_root }}
        run: |
          mkdir -p dist/desktop
          cp -a staging/linux-x64/. dist/desktop/
          cp -a staging/linux-arm64/. dist/desktop/
          bun run make:latest --host modelscope --channel linux \
            --product "$PRODUCT_NAME" --channel-root "$CHANNEL_ROOT" \
            --from-dir dist/desktop --collect
          ls -lah dist/desktop

      - name: Upload Linux artifacts to ModelScope CN (phase 1)
        env:
          MODELSCOPE_CN_TOKEN: ${{ secrets.MODELSCOPE_CN_TOKEN }}
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          CHANNEL_ROOT: ${{ needs.release-context.outputs.channel_root }}
        run: |
          test -n "${MODELSCOPE_CN_TOKEN:-${MODELSCOPE_TOKEN:-}}" || {
            echo "MODELSCOPE_CN_TOKEN is not configured" >&2
            exit 1
          }
          bun scripts/run-upload-modelscope.mjs \
            --dist-dir dist/desktop/ \
            --channel linux \
            --channel-root "$CHANNEL_ROOT" \
            --api-host modelscope.cn \
            --repo flowy2025/flowyaipc \
            --token-env MODELSCOPE_CN_TOKEN \
            --artifacts-only \
            --retries "$UPLOAD_RETRIES" \
            --retry-base-sec "$UPLOAD_RETRY_BASE_SEC"

      - name: Publish Linux channel pointer on ModelScope CN (phase 2)
        env:
          MODELSCOPE_CN_TOKEN: ${{ secrets.MODELSCOPE_CN_TOKEN }}
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          CHANNEL_ROOT: ${{ needs.release-context.outputs.channel_root }}
        run: |
          bun scripts/run-upload-modelscope.mjs \
            --dist-dir dist/desktop/ \
            --channel linux \
            --channel-root "$CHANNEL_ROOT" \
            --api-host modelscope.cn \
            --repo flowy2025/flowyaipc \
            --token-env MODELSCOPE_CN_TOKEN \
            --manifest-only \
            --retries "$UPLOAD_RETRIES" \
            --retry-base-sec "$UPLOAD_RETRY_BASE_SEC"

      - name: Verify Linux channel on ModelScope CN
        env:
          EXPECTED_VERSION: ${{ needs.release-context.outputs.version }}
          CHANNEL_ROOT: ${{ needs.release-context.outputs.channel_root }}
        run: |
          python scripts/verify-modelscope-release.py \
            --channel linux \
            --channel-root "$CHANNEL_ROOT" \
            --api-host modelscope.cn \
            --repo flowy2025/flowyaipc \
            --version "$EXPECTED_VERSION" \
            --platform linux-x86_64 \
            --platform linux-aarch64 \
            --check-artifacts \
            --metadata dist/desktop/release-metadata.json

      - name: Upload Linux artifacts to ModelScope AI (phase 1)
        env:
          MODELSCOPE_AI_TOKEN: ${{ secrets.MODELSCOPE_AI_TOKEN }}
          CHANNEL_ROOT: ${{ needs.release-context.outputs.channel_root }}
        run: |
          test -n "$MODELSCOPE_AI_TOKEN" || {
            echo "MODELSCOPE_AI_TOKEN is not configured" >&2
            exit 1
          }
          bun scripts/run-upload-modelscope.mjs \
            --dist-dir dist/desktop/ \
            --channel linux \
            --channel-root "$CHANNEL_ROOT" \
            --api-host modelscope.ai \
            --repo flowy2025/flowy \
            --token-env MODELSCOPE_AI_TOKEN \
            --artifacts-only \
            --retries "$UPLOAD_RETRIES" \
            --retry-base-sec "$UPLOAD_RETRY_BASE_SEC"

      - name: Publish Linux channel pointer on ModelScope AI (phase 2)
        env:
          MODELSCOPE_AI_TOKEN: ${{ secrets.MODELSCOPE_AI_TOKEN }}
          CHANNEL_ROOT: ${{ needs.release-context.outputs.channel_root }}
        run: |
          bun scripts/run-upload-modelscope.mjs \
            --dist-dir dist/desktop/ \
            --channel linux \
            --channel-root "$CHANNEL_ROOT" \
            --api-host modelscope.ai \
            --repo flowy2025/flowy \
            --token-env MODELSCOPE_AI_TOKEN \
            --manifest-only \
            --retries "$UPLOAD_RETRIES" \
            --retry-base-sec "$UPLOAD_RETRY_BASE_SEC"

      - name: Verify Linux channel on ModelScope AI
        env:
          EXPECTED_VERSION: ${{ needs.release-context.outputs.version }}
          CHANNEL_ROOT: ${{ needs.release-context.outputs.channel_root }}
        run: |
          python scripts/verify-modelscope-release.py \
            --channel linux \
            --channel-root "$CHANNEL_ROOT" \
            --api-host modelscope.ai \
            --repo flowy2025/flowy \
            --version "$EXPECTED_VERSION" \
            --platform linux-x86_64 \
            --platform linux-aarch64 \
            --check-artifacts \
            --metadata dist/desktop/release-metadata.json

      - name: Upload Linux artifacts to GitHub Release
        if: needs.release-context.outputs.publish_github == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-github-ota.sh "${{ needs.release-context.outputs.tag }}" linux dist/desktop

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-release-metadata
          path: |
            dist/desktop/latest.json
            dist/desktop/channel.yml
            dist/desktop/release-metadata.json
          retention-days: 30
          if-no-files-found: warn

  release-status:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [publish-windows, publish-macos, publish-linux]
    if: always()
    steps:
      - name: Require all platform publishes
        env:
          WINDOWS: ${{ needs.publish-windows.result }}
          MACOS: ${{ needs.publish-macos.result }}
          LINUX: ${{ needs.publish-linux.result }}
        run: |
          {
            echo "### ModelScope release gate"
            echo ""
            echo "| Channel | Result |"
            echo "|---|---|"
            echo "| windows | \`$WINDOWS\` |"
            echo "| macos | \`$MACOS\` |"
            echo "| linux | \`$LINUX\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          ok=1
          for result in "$WINDOWS" "$MACOS" "$LINUX"; do
            if [[ "$result" != "success" ]]; then
              ok=0
            fi
          done
          if [[ "$ok" -ne 1 ]]; then
            echo "One or more platform publishes did not succeed" >&2
            exit 1
          fi
          echo "All platform channels published successfully"
