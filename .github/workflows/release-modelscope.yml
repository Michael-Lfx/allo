name: Release platform to ModelScope

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*.*.*-*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag (builds Windows, macOS, and Linux)
        required: true
        type: string

permissions:
  contents: read

# One release tag runs all platforms; do not cancel a sibling platform mid-upload.
concurrency:
  group: modelscope-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release-context:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$MANUAL_TAG"
          else
            tag="$PUSH_TAG"
          fi
          # Accept only vX.Y.Z — reject legacy vX.Y.Z-{windows,macos,linux} tags.
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $tag (expected vX.Y.Z)" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Verify tag and workspace version
        id: release
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"

          git_tag="$(git describe --tags --exact-match --match "$RELEASE_TAG")"
          if [[ "$git_tag" != "$RELEASE_TAG" ]]; then
            echo "Checked-out tag $git_tag does not match requested tag $RELEASE_TAG" >&2
            exit 1
          fi

          workspace_version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ -z "$workspace_version" || "$workspace_version" != "$version" ]]; then
            echo "Tag version $version does not match Cargo.toml version ${workspace_version:-<missing>}" >&2
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  release-windows:
    name: Build and publish Windows
    needs: release-context
    runs-on: windows-latest
    environment: modelscope-alpha
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-context.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          python -m pip install modelscope

      - name: Build Windows updater (x64 + arm64)
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw 'TAURI_SIGNING_PRIVATE_KEY is not configured'
          }
          bun run build:win x64 arm64 --config apps/desktop/tauri.updater.conf.json --config apps/desktop/tauri.channel.windows.conf.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run make:latest --host modelscope --channel windows --collect
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows release
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          if (-not $env:MODELSCOPE_TOKEN) {
            throw 'MODELSCOPE_TOKEN is not configured'
          }
          bun run upload:modelscope -- --channel windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Windows channel entries
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          python scripts/verify-modelscope-release.py \
            --channel windows \
            --version "$EXPECTED_VERSION" \
            --platform windows-x86_64 \
            --platform windows-aarch64

  release-macos:
    name: Build and publish macOS
    needs: release-context
    runs-on: macos-14
    environment: modelscope-alpha
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-context.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          python -m pip install modelscope

      - name: Build macOS updater (universal)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "TAURI_SIGNING_PRIVATE_KEY is not configured" >&2
            exit 1
          }
          # Universal covers darwin-aarch64 + darwin-x86_64 with one updater
          # artifact (avoids Flowy.app.tar.gz basename collisions). The Intel
          # slice omits ort; robot VAD falls back to energy there.
          bun run build:mac universal --config apps/desktop/tauri.updater.conf.json --config apps/desktop/tauri.channel.macos.conf.json
          bun run make:latest --host modelscope --channel macos --collect

      - name: Upload macOS release
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          test -n "$MODELSCOPE_TOKEN" || {
            echo "MODELSCOPE_TOKEN is not configured" >&2
            exit 1
          }
          bun run upload:modelscope -- --channel macos

      - name: Verify macOS channel entries
        env:
          EXPECTED_VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          python scripts/verify-modelscope-release.py \
            --channel macos \
            --version "$EXPECTED_VERSION" \
            --platform darwin-aarch64 \
            --platform darwin-x86_64

  release-linux:
    name: Build and publish Linux
    needs: release-context
    runs-on: ubuntu-24.04
    environment: modelscope-alpha
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-context.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libpipewire-0.3-dev \
            libgbm-dev \
            libclang-dev \
            librsvg2-dev \
            libasound2-dev \
            xdg-utils

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          python -m pip install modelscope

      - name: Build Linux updater
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "TAURI_SIGNING_PRIVATE_KEY is not configured" >&2
            exit 1
          }
          bun run build:linux --config apps/desktop/tauri.updater.conf.json --config apps/desktop/tauri.channel.linux.conf.json
          bun run make:latest --host modelscope --channel linux --collect

      - name: Upload Linux release
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          test -n "$MODELSCOPE_TOKEN" || {
            echo "MODELSCOPE_TOKEN is not configured" >&2
            exit 1
          }
          bun run upload:modelscope -- --channel linux

      - name: Verify Linux channel entry
        env:
          EXPECTED_VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          python scripts/verify-modelscope-release.py \
            --channel linux \
            --version "$EXPECTED_VERSION" \
            --platform linux-x86_64
