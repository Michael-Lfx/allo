[package]
name = "nomifun-cloud"
version.workspace = true
edition.workspace = true

[dependencies]
nomifun-common.workspace = true
nomifun-api-types.workspace = true
nomifun-auth.workspace = true
nomifun-db.workspace = true
nomi-config.workspace = true
nomi-process-runtime.workspace = true
nomi-providers.workspace = true
nomi-types.workspace = true
axum.workspace = true
dashmap.workspace = true
serde_json.workspace = true
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
image.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v4"] }
tower-http.workspace = true
sha2.workspace = true
hex.workspace = true
aes-gcm.workspace = true
base64.workspace = true
getrandom.workspace = true
rqrr = "0.9"
sysinfo = { workspace = true, features = ["system", "disk"] }

[features]
default = []
http3-experimental = ["reqwest/http3"]

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_SystemInformation",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
core-foundation = "0.10"
core-foundation-sys = "0.8"
io-kit-sys = "0.4"

[dev-dependencies]
clap = { workspace = true }
tempfile.workspace = true
wiremock.workspace = true
nomi-types.workspace = true
