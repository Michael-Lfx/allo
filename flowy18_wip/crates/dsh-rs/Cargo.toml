# Copied from https://github.com/redoop/dsh-rs @ b7a1a1afef82d1222d81e5e2966180e24ce469f3
# (2026-08-25). That repo stopped while official dsh kept moving. This tree is
# the one we change to stay aligned with https://github.com/deepseek-ai/deepseek-harness.
[package]
name = "dsh-rs"
description = "The dsh agent harness, collapsed into one crate: plugins, typed events, manifest validation, multi-provider LLM seam, and the dsh CLI."
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/redoop/dsh-rs"
keywords = ["agent", "llm", "plugin", "cli", "harness"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "dsh_rs"
path = "src/lib.rs"

[[bin]]
name = "dsh"
path = "src/main.rs"
required-features = ["unstable"]

[dependencies]
# The kernel (published on crates.io as cordis-rust; lib name stays cordis).
cordis = { version = "0.2", package = "cordis-rust" }
dsh-plugin-contract = { path = "crates/dsh-plugin-contract" }

tokio = { version = "1.50", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "process",
    "io-util",
    "fs",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures = "0.3"

# OpenAI-compatible LLM adapter (the `openai` feature, enabled by default).
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"], optional = true }
futures-util = { version = "0.3", optional = true }
bytes = { version = "1", optional = true }

# Tools (bash/glob/grep) and dynamic-plugin loading.
regex = "1"
libloading = "0.8"

# Terminal chat UI (dsh chat).
ratatui = "0.29"
unicode-width = "0.2"
unicode-segmentation = "1"

[features]
default = ["openai"]
openai = ["dep:reqwest", "dep:futures-util", "dep:bytes"]
# Exposes implementation modules for the CLI binary and integration tests.
# Desktop/app consumers must not enable this — use `api` / `types` / `bundle`.
unstable = []