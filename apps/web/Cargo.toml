[package]
name = "nomifun-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nomifun-web"
path = "src/main.rs"

[features]
default = []
static-webui = []

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"

[dependencies]
# The unified backend, consumed in-process as a library (no spawned binary).
# P2 will expose nomifun_app's boot entry (init_environment / data layer /
# AppServices) so this host can mount the real /api router. For now this host
# serves the built SPA (ui/dist) and a health endpoint.
# The workspace root declares nomifun-app with default-features=false (the
# agent-store host opts in per-feature). Feature inheritance cannot re-enable
# defaults, so this host lists nomifun-app's full default set explicitly.
nomifun-app = { workspace = true, features = [
    "telegram", "lark", "dingtalk", "weixin", "wecom", "discord", "matrix",
    "mattermost", "slack", "twitch", "nostr", "qqbot",
    "bedrock", "silero-vad",
] }
nomifun-common.workspace = true
nomifun-runtime.workspace = true

tokio.workspace = true
axum.workspace = true
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["fs", "trace"] }
tracing.workspace = true
anyhow.workspace = true
clap.workspace = true
