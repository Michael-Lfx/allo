<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=block">
<link rel="stylesheet" href="../base.css">
<style>
  .slide { background: #FFF8F0; color: #3D3A35; font-family: 'Nunito', sans-serif; }
  .blob { left: 700px; top: 60px; width: 560px; height: 600px; border-radius: 48% 52% 44% 56% / 56% 44% 56% 44%; background: #FFD6A5; }
  .blob2 { left: 1080px; top: -80px; width: 260px; height: 260px; border-radius: 50%; background: #F28C6A; opacity: .35; }
  .panel { left: 790px; top: 150px; width: 380px; height: 420px; border-radius: 40px; background: #FFFFFF; box-shadow: 0 24px 48px rgba(61,58,53,.10); }
  .tag { left: 96px; top: 104px; padding: 8px 20px; border-radius: 999px; background: rgba(242,140,106,.16); color: #F28C6A; font-size: 17px; font-weight: 800; }

  .days { left: 98px; top: 520px; display: flex; gap: 12px; }
  .days span { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; font-weight: 800; background: #FFFFFF; box-shadow: 0 6px 14px rgba(61,58,53,.08); }
  .days .on { background: #F28C6A; color: #FFFFFF; }
  .cap { left: 830px; top: 476px; width: 300px; font-size: 20px; font-weight: 800; text-align: center; }
  .cap small { display: block; margin-top: 4px; font-size: 15px; font-weight: 600; opacity: .6; }

</head>

<main class="slide">
  <div class="blob"></div>
  <div class="blob2"></div>
  <div class="panel"></div>
  <svg class="abs" style="left:880px;top:190px" width="200" height="270" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <rect x="30" y="96" width="130" height="34" rx="17" fill="#FFD6A5"/>
