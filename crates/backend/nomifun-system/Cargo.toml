[package]
name = "nomifun-system"
version.workspace = true
edition.workspace = true

[features]
default = ["bedrock"]
# AWS Bedrock support (managed model catalog fetch + connection test). The
# aws-sdk-bedrock crate is code-generated and huge (~60 MB of rlib), so
# in-process hosts that don't serve Bedrock (agent-store) turn it off; the
# desktop/web hosts keep the default on.
bedrock = ["dep:aws-config", "dep:aws-sdk-bedrock"]

[dependencies]
nomifun-auth.workspace = true
nomifun-common.workspace = true
nomifun-db.workspace = true
nomifun-net.workspace = true
nomifun-api-types.workspace = true
nomifun-models-dev.workspace = true
async-trait.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
reqwest.workspace = true
tokio.workspace = true
getrandom.workspace = true
futures.workspace = true
aws-config = { workspace = true, optional = true }
aws-sdk-bedrock = { workspace = true, optional = true }
semver.workspace = true
dirs.workspace = true
zip.workspace = true
nomi-redact.workspace = true
uuid = { workspace = true, features = ["v4"] }
chrono.workspace = true
sys-locale.workspace = true

[dev-dependencies]
tower = { workspace = true }
http-body-util.workspace = true
reqwest.workspace = true
wiremock = "0.6"
tempfile.workspace = true
