<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Josefin+Sans:wght@600;700&display=block">
<link rel="stylesheet" href="../base.css">
<style>
  .slide { background: #F1E4C9; color: #2E2A24; font-family: 'Josefin Sans', sans-serif; }
  .rays { left: 520px; top: -180px; width: 1000px; height: 1000px; border-radius: 50%; background: repeating-conic-gradient(from 0deg, rgba(237,174,73,.55) 0deg 9deg, transparent 9deg 18deg); }
  .sun { left: 790px; top: 90px; width: 460px; height: 460px; border-radius: 50%; background: #D1495B; }
  .halftone { left: 790px; top: 90px; width: 460px; height: 460px; border-radius: 50%; background-image: radial-gradient(rgba(241,228,201,.35) 30%, transparent 32%); background-size: 12px 12px; mask-image: linear-gradient(180deg, transparent 30%, #000 100%); }
  .band1 { left: 0; right: 0; top: 500px; height: 46px; background: #EDAE49; }
  .band2 { left: 0; right: 0; top: 556px; height: 46px; background: #00798C; }
  .band3 { left: 0; right: 0; top: 612px; height: 108px; background: #2E2A24; }
  .kicker { left: 84px; top: 96px; font-size: 20px; font-weight: 700; letter-spacing: .3em; color: #00798C; }
  h1 { left: 76px; top: 128px; font-family: 'Shrikhand', cursive; font-size: 128px; line-height: .98; color: #D1495B; text-shadow: 5px 5px 0 #2E2A24; }
  .sub { left: 84px; top: 410px; font-size: 26px; font-weight: 600; letter-spacing: .12em; }
  .dates { left: 84px; top: 644px; font-size: 22px; font-weight: 700; letter-spacing: .24em; color: #F1E4C9; }
  .dates b { color: #EDAE49; }
  .seal { right: 72px; top: 636px; font-size: 17px; font-weight: 700; letter-spacing: .2em; color: #EDAE49; }
  .grain { inset: 0; mix-blend-mode: multiply; opacity: .5; }
</style>
</head>
<body>
<main class="slide">
  <div class="rays"></div>
  <div class="sun"></div>
  <div class="halftone"></div>
  <div class="band1"></div>
  <div class="band2"></div>
  <div class="band3"></div>
  <div class="kicker">SUMMER CONCERT SERIES</div>
  <h1>Sunset<br>Sessions</h1>
  <p class="sub">LIVE MUSIC · ROOFTOP · GOOD COMPANY</p>
  <div class="dates"><b>JUN 12</b> — <b>AUG 28</b> · EVERY FRIDAY</div>
  <div class="seal">EST. 1972</div>
  <svg class="grain" width="1280" height="720"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="5"/><feColorMatrix values="0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .2  0 0 0 .2 0"/></filter><rect width="1280" height="720" filter="url(#g)"/></svg>
</main>
</body>
</html>
