# 定义语言基础词表(仓库级,跨课程复用;票 #173 / 调研档 definition-grounding-survey.md §12/§17)
#
# 语义:本表是「写定义用的语言」,不是知识内容——表内词在定义接地检查(candidate_terms/
# grounding_runs)中视为**已着落**,不再作为缺口点名。准入判据:删掉它定义会缺语法/关系
# 信息,但不会缺知识信息;领域名词(线段/内角/平均分…)永远不进本表,应挂号由课程来教。
#
# 纪律(ADR-0034 将固化):增词必须走仓库提交(人工裁决,带依据);课程级例外走
# courses/<slug>/lexicon-course.yaml 的本地增词/豁免段,不得反向污染本表。
# 维护流程:词汇裁决代理(#174)产出 promote 提案 → 人工批量确认 → 本文件 diff。

