name: Release platform to ModelScope

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*.*.*-*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag (builds Windows, macOS, and Linux)
        required: true
        type: string

permissions:
  contents: read

# One release tag runs all platforms; do not cancel a sibling platform mid-upload.
concurrency:
  group: modelscope-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  BUN_VERSION: "1.3.13"
  PYTHON_VERSION: "3.12"
  UPLOAD_RETRIES: "5"
  UPLOAD_RETRY_BASE_SEC: "30"

jobs:
  release-context:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$MANUAL_TAG"
          else
            tag="$PUSH_TAG"
          fi
          # Accept only vX.Y.Z — reject legacy vX.Y.Z-{windows,macos,linux} tags.
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $tag (expected vX.Y.Z)" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Verify tag and workspace version
        id: release
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"

          git_tag="$(git describe --tags --exact-match --match "$RELEASE_TAG")"
          if [[ "$git_tag" != "$RELEASE_TAG" ]]; then
            echo "Checked-out tag $git_tag does not match requested tag $RELEASE_TAG" >&2
            exit 1
          fi

          workspace_version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ -z "$workspace_version" || "$workspace_version" != "$version" ]]; then
            echo "Tag version $version does not match Cargo.toml version ${workspace_version:-<missing>}" >&2
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # ui/dist is platform-independent; build once on a 16GB runner for macOS.
  build-ui:
    name: Build SPA
    needs: release-context
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-context.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build UI
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: bun run build:ui

      - uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 3
          if-no-files-found: error

  # ── Windows: build x64 and arm64 in parallel (no shared output) ───────────
  build-windows:
    name: Build Windows (${{ matrix.arch }})
    needs: release-context
    runs-on: windows-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rust_targets: x86_64-pc-windows-msvc
            artifact_name: windows-x64-dist
          - arch: arm64
            rust_targets: aarch64-pc-windows-msvc
            artifact_name: windows-arm64-dist
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-context.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-${{ matrix.arch }}-updater

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Windows updater (${{ matrix.arch }})
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw 'TAURI_SIGNING_PRIVATE_KEY is not configured'
          }
          bun run build:win ${{ matrix.arch }} `
            --config apps/desktop/tauri.updater.conf.json `
            --config apps/desktop/tauri.channel.windows.conf.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run make:latest --host modelscope --channel windows --collect
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/desktop/
          retention-days: 3
          if-no-files-found: error

  publish-windows:
    name: Publish Windows channel
    needs: [release-context, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: modelscope-alpha
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-context.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install upload deps
        run: |
          bun install --frozen-lockfile
          python -m pip install -r scripts/requirements-modelscope.txt

      - uses: actions/download-artifact@v7
        with:
          name: windows-x64-dist
          path: staging/windows-x64

      - uses: actions/download-artifact@v7
        with:
          name: windows-arm64-dist
          path: staging/windows-arm64

      - name: Merge Windows dist and refresh manifest
        run: |
          mkdir -p dist/desktop
          cp -a staging/windows-x64/. dist/desktop/
          cp -a staging/windows-arm64/. dist/desktop/
          bun run make:latest --host modelscope --channel windows --from-dir dist/desktop --collect
          ls -lah dist/desktop

      - name: Upload Windows artifacts (phase 1)
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          test -n "$MODELSCOPE_TOKEN" || {
            echo "MODELSCOPE_TOKEN is not configured" >&2
            exit 1
          }
          bun scripts/run-upload-modelscope.mjs \
            --dist-dir dist/desktop/ \
            --channel windows \
            --artifacts-only \
            --retries "$UPLOAD_RETRIES" \
            --retry-base-sec "$UPLOAD_RETRY_BASE_SEC"

      - name: Publish Windows channel pointer (phase 2)
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          bun scripts/run-upload-modelscope.mjs \
            --dist-dir dist/desktop/ \
            --channel windows \
            --manifest-only \
            --retries "$UPLOAD_RETRIES" \
            --retry-base-sec "$UPLOAD_RETRY_BASE_SEC"

      - name: Verify Windows channel
        env:
          EXPECTED_VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          python scripts/verify-modelscope-release.py \
            --channel windows \
            --version "$EXPECTED_VERSION" \
            --platform windows-x86_64 \
            --platform windows-aarch64 \
            --check-artifacts \
            --metadata dist/desktop/release-metadata.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-release-metadata
          path: |
            dist/desktop/latest.json
            dist/desktop/channel.yml
            dist/desktop/release-metadata.json
          retention-days: 30
          if-no-files-found: warn

  # ── macOS ─────────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS
    needs: [release-context, build-ui]
    runs-on: macos-14
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-context.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-universal-updater

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v7
        with:
          name: ui-dist
          path: ui/dist

      - name: Build macOS updater (universal)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "TAURI_SIGNING_PRIVATE_KEY is not configured" >&2
            exit 1
          }
          bun run build:mac universal \
            --config apps/desktop/tauri.updater.conf.json \
            --config apps/desktop/tauri.channel.macos.conf.json \
            --config apps/desktop/tauri.ci-skip-ui.conf.json
          bun run make:latest --host modelscope --channel macos --collect

      - uses: actions/upload-artifact@v7
        with:
          name: macos-dist
          path: dist/desktop/
          retention-days: 3
          if-no-files-found: error

  publish-macos:
    name: Publish macOS channel
    needs: [release-context, build-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: modelscope-alpha
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-context.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install upload deps
        run: |
          bun install --frozen-lockfile
          python -m pip install -r scripts/requirements-modelscope.txt

      - uses: actions/download-artifact@v7
        with:
          name: macos-dist
          path: dist/desktop

      - name: Upload macOS artifacts (phase 1)
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          test -n "$MODELSCOPE_TOKEN" || {
            echo "MODELSCOPE_TOKEN is not configured" >&2
            exit 1
          }
          bun scripts/run-upload-modelscope.mjs \
            --dist-dir dist/desktop/ \
            --channel macos \
            --artifacts-only \
            --retries "$UPLOAD_RETRIES" \
            --retry-base-sec "$UPLOAD_RETRY_BASE_SEC"

      - name: Publish macOS channel pointer (phase 2)
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          bun scripts/run-upload-modelscope.mjs \
            --dist-dir dist/desktop/ \
            --channel macos \
            --manifest-only \
            --retries "$UPLOAD_RETRIES" \
            --retry-base-sec "$UPLOAD_RETRY_BASE_SEC"

      - name: Verify macOS channel
        env:
          EXPECTED_VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          python scripts/verify-modelscope-release.py \
            --channel macos \
            --version "$EXPECTED_VERSION" \
            --platform darwin-aarch64 \
            --platform darwin-x86_64 \
            --check-artifacts \
            --metadata dist/desktop/release-metadata.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-release-metadata
          path: |
            dist/desktop/latest.json
            dist/desktop/channel.yml
            dist/desktop/release-metadata.json
          retention-days: 30
          if-no-files-found: warn

  # ── Linux ─────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux
    needs: release-context
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-context.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-x64-updater

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libpipewire-0.3-dev \
            libgbm-dev \
            libclang-dev \
            librsvg2-dev \
            libasound2-dev \
            xdg-utils

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Linux updater
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "TAURI_SIGNING_PRIVATE_KEY is not configured" >&2
            exit 1
          }
          bun run build:linux --config apps/desktop/tauri.updater.conf.json --config apps/desktop/tauri.channel.linux.conf.json
          bun run make:latest --host modelscope --channel linux --collect

      - uses: actions/upload-artifact@v7
        with:
          name: linux-dist
          path: dist/desktop/
          retention-days: 3
          if-no-files-found: error

  publish-linux:
    name: Publish Linux channel
    needs: [release-context, build-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: modelscope-alpha
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-context.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install upload deps
        run: |
          bun install --frozen-lockfile
          python -m pip install -r scripts/requirements-modelscope.txt

      - uses: actions/download-artifact@v7
        with:
          name: linux-dist
          path: dist/desktop

      - name: Upload Linux artifacts (phase 1)
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          test -n "$MODELSCOPE_TOKEN" || {
            echo "MODELSCOPE_TOKEN is not configured" >&2
            exit 1
          }
          bun scripts/run-upload-modelscope.mjs \
            --dist-dir dist/desktop/ \
            --channel linux \
            --artifacts-only \
            --retries "$UPLOAD_RETRIES" \
            --retry-base-sec "$UPLOAD_RETRY_BASE_SEC"

      - name: Publish Linux channel pointer (phase 2)
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          bun scripts/run-upload-modelscope.mjs \
            --dist-dir dist/desktop/ \
            --channel linux \
            --manifest-only \
            --retries "$UPLOAD_RETRIES" \
            --retry-base-sec "$UPLOAD_RETRY_BASE_SEC"

      - name: Verify Linux channel
        env:
          EXPECTED_VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          python scripts/verify-modelscope-release.py \
            --channel linux \
            --version "$EXPECTED_VERSION" \
            --platform linux-x86_64 \
            --check-artifacts \
            --metadata dist/desktop/release-metadata.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-release-metadata
          path: |
            dist/desktop/latest.json
            dist/desktop/channel.yml
            dist/desktop/release-metadata.json
          retention-days: 30
          if-no-files-found: warn

  release-status:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [publish-windows, publish-macos, publish-linux]
    if: always()
    steps:
      - name: Require all platform publishes
        env:
          WINDOWS: ${{ needs.publish-windows.result }}
          MACOS: ${{ needs.publish-macos.result }}
          LINUX: ${{ needs.publish-linux.result }}
        run: |
          {
            echo "### ModelScope release gate"
            echo ""
            echo "| Channel | Result |"
            echo "|---|---|"
            echo "| windows | \`$WINDOWS\` |"
            echo "| macos | \`$MACOS\` |"
            echo "| linux | \`$LINUX\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          ok=1
          for result in "$WINDOWS" "$MACOS" "$LINUX"; do
            if [[ "$result" != "success" ]]; then
              ok=0
            fi
          done
          if [[ "$ok" -ne 1 ]]; then
            echo "One or more platform publishes did not succeed" >&2
            exit 1
          fi
          echo "All platform channels published successfully"
