<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=block">
<link rel="stylesheet" href="../base.css">
<style>
  .slide { background: linear-gradient(135deg, #1C2A6B, #7B3FD1); color: #FFFFFF; font-family: 'Sora', sans-serif; }
  .blob { border-radius: 50%; filter: blur(70px); }
  .b1 { left: 820px; top: -120px; width: 520px; height: 520px; background: #7DF9FF; opacity: .55; }
  .b2 { left: -120px; top: 420px; width: 520px; height: 420px; background: #9CC3FF; opacity: .5; }
  .b3 { left: 560px; top: 360px; width: 420px; height: 420px; background: #E05BFF; opacity: .45; }
  .glass { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.38); backdrop-filter: blur(28px); box-shadow: inset 0 1px 0 rgba(255,255,255,.4); }
  .panel { left: 72px; top: 120px; width: 760px; height: 470px; border-radius: 32px; }
  .ring { left: 930px; top: 150px; width: 260px; height: 260px; border-radius: 50%; border: 22px solid rgba(255,255,255,.18); box-shadow: 0 0 0 1px rgba(255,255,255,.45), inset 0 0 0 1px rgba(255,255,255,.45); }
  .top { left: 128px; top: 172px; right: 520px; display: flex; justify-content: space-between; font-size: 15px; font-weight: 600; letter-spacing: .2em; color: #7DF9FF; }
  h1 { left: 124px; top: 224px; font-size: 90px; font-weight: 700; line-height: 1.02; letter-spacing: -0.035em; }
  h1 span { background: linear-gradient(90deg, #FFFFFF, #7DF9FF); -webkit-background-clip: text; color: transparent; }
  .sub { left: 128px; top: 450px; width: 560px; font-size: 22px; line-height: 1.45; color: rgba(255,255,255,.78); }
  .chip { left: 900px; top: 470px; width: 300px; height: 120px; border-radius: 24px; padding: 24px 28px; }
  .chip small { display: block; font-size: 14px; letter-spacing: .14em; color: rgba(255,255,255,.7); }
  .chip b { display: block; margin-top: 10px; font-size: 30px; font-weight: 600; }
  .dot { display: inline-block; width: 10px; height: 10px; margin-right: 8px; border-radius: 50%; background: #7DF9FF; box-shadow: 0 0 12px #7DF9FF; }
</style>
</head>
<body>
<main class="slide">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="ring"></div>
  <div class="glass panel"></div>
  <div class="top"><span>PRODUCT KEYNOTE</span><span>2026</span></div>
  <h1>Design<br><span>Beyond Limits</span></h1>
  <p class="sub">A new canvas for teams who build with light, motion and depth.</p>
  <div class="glass chip"><small><span class="dot"></span>LIVE DEMO</small><b>10:00 AM PST</b></div>
</main>
</body>
</html>
