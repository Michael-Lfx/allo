name: CI

# The release workflow only runs on tags, so nothing on this repository ever
# compiled a pull request before this file existed. That is how a Dependabot
# `rmcp` 1.x -> 2.0 bump landed with no code adaptation and left `main`
# uncompilable, and how four `bun run check` gates went red unnoticed. This job
# is deliberately the cheapest thing that would have caught both: one compile
# pass over every crate and test target, plus the gates that are green today.
#
# Known-red gates are deliberately NOT wired in yet — see
# .github/workflows/README.md § "PR CI" for the list and the reason.
#
# Documentation-only changes skip both Rust jobs; `changes` decides. The
# allowlist, and why it is narrow rather than "every *.md" (markdown reaches the
# compiled binary through `include_str!`), live in scripts/ci-changed-paths.mjs
# and .github/workflows/README.md § "Docs-only changes". `repo-gates` is never
# skipped — it reads the docs and the docs site.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  BUN_VERSION: "1.3.13"
  CARGO_INCREMENTAL: "0"
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: "sparse"

jobs:
  # Decides whether the two Rust jobs below are needed at all. It is meant to be
  # the cheapest job in the workflow: `sparse-checkout: scripts` keeps it off the
  # 111 MiB / 6508-file working tree, and for a sparse checkout the action
  # applies `filter: blob:none` itself — setting `filter` explicitly would
  # *override* sparse-checkout and pull the whole tree anyway.
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.decide.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          # 0 = all history for all branches and tags, so the base and head
          # commits named by the event payload are present locally and
          # `git merge-base` is meaningful.
          fetch-depth: 0
          sparse-checkout: scripts

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # The detector decides whether the Rust jobs run, so assert its contract
      # first. If this fails, `decide` is skipped and its output stays empty —
      # and an empty value is still `!= 'true'`, so the Rust jobs run anyway.
      # Red, never silent.
      - name: Changed-path detector contract
        run: bun scripts/ci-changed-paths.mjs --self-test

      - name: Decide whether the Rust jobs are needed
        id: decide
        run: bun scripts/ci-changed-paths.mjs

  rust-compile:
    name: Cargo check (workspace + tests)
    needs: changes
    # Three things this condition has to get right:
    #   1. A job-level `if`, not a trigger-level `paths-ignore`. A skipped job is
    #      still reported as a check run on the pull request; a path filter makes
    #      the check never appear at all, which would leave a docs-only pull
    #      request waiting forever the day `main` gains required checks.
    #   2. `!cancelled()` is load-bearing. The implicit condition is `success()`,
    #      so if the detector job ever fails these two jobs would be *skipped* —
    #      the exact silent skip this arrangement must not introduce. `always()`
    #      would also work, but would resurrect jobs in a run that concurrency
    #      already cancelled.
    #   3. A missing or empty output is not the string 'true', so every failure
    #      mode runs the Rust jobs rather than skipping them.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    # A cold run compiles every crate in the workspace (including the vendored
    # sherpa/onnx build scripts); rust-cache makes every later run incremental.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@stable

      # The repository pins the rsproxy mirror in .cargo/config.toml; a GitHub
      # runner must use the built-in crates.io index instead.
      - name: Use crates.io from GitHub
        run: bun scripts/ci-use-crates-io.mjs

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-linux-check
          workspaces: ". -> build.noindex"
          cache-on-failure: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libpipewire-0.3-dev \
            libgbm-dev \
            libclang-dev \
            librsvg2-dev \
            libasound2-dev \
            xdg-utils

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      # Some crates embed `ui/dist` at compile time; on a fresh clone the path
      # must exist even though only a real build fills it.
      - name: Provide ui/dist placeholder
        run: bun scripts/ensure-ui-dist.mjs

      - name: cargo check --workspace --tests
        run: cargo check --workspace --tests --locked

  repo-gates:
    name: Repo gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Repo-level gates
        run: |
          bun run check:i18n
          bun run check:theme
          bun run check:icons
          bun run check:codemirror-runtime
          bun run check:error-surface-contract
          bun run check:support-surface-contract
          bun run check:windows-console-hide
          bun run check:process-runtime-boundary
          bun run check:browser-platform-boundary
          bun run check:market
          bun run check:fingerprint
          bun run check:release-sync
          bun run help --check

      # Present only once the Agent Store frontend is on the branch that runs
      # this workflow; the guard keeps the job valid on `main` before that.
      - name: Agent Store frontend (web/)
        if: ${{ hashFiles('web/package.json') != '' }}
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test

  tests:
    name: Cargo test (agent + conversation)
    needs: changes
    # Same gate as `rust-compile`; the reasoning is in the comment there.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Use crates.io from GitHub
        run: bun scripts/ci-use-crates-io.mjs

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-linux-check
          workspaces: ". -> build.noindex"
          cache-on-failure: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libpipewire-0.3-dev \
            libgbm-dev \
            libclang-dev \
            librsvg2-dev \
            libasound2-dev \
            xdg-utils

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Provide ui/dist placeholder
        run: bun scripts/ensure-ui-dist.mjs

      # Starting scope: two crates whose suites are fast, deterministic and were
      # silently red before this job existed (`cargo check --tests` compiles test
      # targets but never runs them). Widen the list as the rest of the workspace
      # becomes trustworthy enough to gate.
      - name: cargo test -p nomi-agent --lib
        run: cargo test -p nomi-agent --lib --locked

      # `nomifun-conversation` is gated from today on. The one test that used to
      # be skipped here was red on `main` itself and tracked a real gap rather
      # than a stale expectation: fail-closed was not visible on the wire while
      # the durable correction was wedged (issue #233). The relay now retracts
      # invalidated artifact receipts before the first terminal persistence
      # await, so that test is un-skipped and the crate is gated in full.
      - name: cargo test -p nomifun-conversation --lib
        run: cargo test -p nomifun-conversation --lib --locked
