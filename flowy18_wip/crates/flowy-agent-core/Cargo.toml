[package]
name = "flowy-agent-core"
description = "Host-owned agent core: message and tool seams, no kernel dependency"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
futures = "0.3"
regex = "1"
reqwest = { workspace = true }
rpi-agent = { workspace = true }
rpi-ai = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "process",
    "rt",
    "sync",
    "time",
] }
tokio-util = { version = "0.7", features = ["rt"] }

[lints]
workspace = true
