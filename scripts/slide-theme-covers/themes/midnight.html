<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=block">
<link rel="stylesheet" href="../base.css">
<style>
  .slide { background: #0B0F1A; color: #E6EAF2; font-family: 'Space Grotesk', sans-serif; }
  .dots { inset: 0; background-image: radial-gradient(rgba(59,130,246,.35) 1px, transparent 1.4px); background-size: 32px 32px; mask-image: radial-gradient(circle at 75% 50%, #000 0, transparent 70%); }
  .bloom { left: 700px; top: 80px; width: 560px; height: 560px; border-radius: 50%; background: radial-gradient(circle, rgba(59,130,246,.45), rgba(59,130,246,0) 65%); }
  .ring { border-radius: 50%; border: 1.5px solid #3B82F6; box-shadow: 0 0 24px rgba(59,130,246,.55), inset 0 0 24px rgba(59,130,246,.25); }
  .r1 { left: 760px; top: 140px; width: 440px; height: 440px; opacity: .35; }
  .r2 { left: 850px; top: 230px; width: 260px; height: 260px; opacity: .7; }
  .core { left: 920px; top: 300px; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #00E0B8, #3B82F6 60%, #0B0F1A); box-shadow: 0 0 80px rgba(0,224,184,.6); }
  .node { width: 12px; height: 12px; border-radius: 50%; background: #00E0B8; box-shadow: 0 0 16px #00E0B8; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .label { left: 80px; top: 92px; font-size: 16px; color: #00E0B8; letter-spacing: .08em; }
  h1 { left: 76px; top: 176px; font-size: 100px; font-weight: 700; line-height: .98; letter-spacing: -0.035em; }
  h1 span { background: linear-gradient(90deg, #3B82F6, #00E0B8); -webkit-background-clip: text; color: transparent; }
  .sub { left: 80px; top: 404px; width: 520px; font-size: 24px; line-height: 1.4; color: rgba(230,234,242,.7); }
  .foot { left: 80px; top: 600px; font-size: 15px; color: rgba(230,234,242,.55); letter-spacing: .06em; }
  .foot b { color: #00E0B8; font-weight: 600; }
  .br { width: 28px; height: 28px; border-color: rgba(230,234,242,.35); border-style: solid; border-width: 0; }
</style>
</head>
<body>
<main class="slide">
  <div class="dots"></div>
  <div class="bloom"></div>
  <svg class="abs" style="left:0;top:0" width="1280" height="720">
    <path d="M0 560 L520 520 L700 380 L1280 330" fill="none" stroke="#00E0B8" stroke-opacity=".18" stroke-width="10"/>
    <path d="M0 560 L520 520 L700 380 L1280 330" fill="none" stroke="#00E0B8" stroke-width="1.5"/>
  </svg>
  <div class="ring r1"></div>
  <div class="ring r2"></div>
  <div class="core"></div>
  <div class="node" style="left:1194px;top:354px"></div>
  <div class="node" style="left:694px;top:374px"></div>
  <div class="node" style="left:844px;top:354px;background:#3B82F6;box-shadow:0 0 16px #3B82F6"></div>
  <div class="br" style="left:48px;top:48px;border-left-width:2px;border-top-width:2px"></div>
  <div class="br" style="right:48px;top:48px;border-right-width:2px;border-top-width:2px"></div>
  <div class="br" style="left:48px;bottom:48px;border-left-width:2px;border-bottom-width:2px"></div>
  <div class="br" style="right:48px;bottom:48px;border-right-width:2px;border-bottom-width:2px"></div>
  <div class="label mono">// LAUNCH EVENT 2026</div>
  <h1>Introducing<br><span>Nova AI</span></h1>
  <p class="sub">The assistant that understands your codebase and ships with your team.</p>
  <div class="foot mono"><b>v1.0</b> · KEYNOTE · 09.18.2026 · SAN FRANCISCO</div>
</main>
</body>
</html>
