[workspace]
resolver = "3"
members = [
    "crates/flowy-core",
    "crates/flowy-app",
    "crates/flowy-auth",
    "crates/flowy-desktop",
    "crates/flowy-chat",
    "crates/flowy-ui",
    "crates/flowy-shell",
    "crates/flowy-studio",
    "crates/flowy-agent",
    "crates/flowy-agent-core",
    "crates/flowy-automation",
    "crates/flowy-i18n",
    "crates/flowy-net",
    "crates/flowy-ota",
    "crates/flowy-obs",
    "crates/flowy-skills",
]
default-members = [
    "crates/flowy-core",
    "crates/flowy-app",
    "crates/flowy-auth",
    "crates/flowy-desktop",
    "crates/flowy-chat",
    "crates/flowy-ui",
    "crates/flowy-shell",
    "crates/flowy-studio",
    "crates/flowy-agent",
    "crates/flowy-agent-core",
    "crates/flowy-automation",
    "crates/flowy-i18n",
    "crates/flowy-net",
    "crates/flowy-ota",
    "crates/flowy-obs",
    "crates/flowy-skills",
]

[workspace.package]
version = "1.8.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/flowy-app/flowy"

[workspace.dependencies]
hayro = "0.9"
oxml-opc = "0.15"
roxmltree = "0.21"
rpptx = "0.15"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = { version = "=0.10.4", features = ["serde"] }
iana-time-zone = "0.1"
fontdb = "0.23"
open = "5"
pulldown-cmark = { version = "0.13.6", default-features = false }
similar = "2"
url = "2.5"
flowy-core = { path = "crates/flowy-core" }
flowy-app = { path = "crates/flowy-app" }
flowy-auth = { path = "crates/flowy-auth" }
flowy-agent = { path = "crates/flowy-agent" }
flowy-agent-core = { path = "crates/flowy-agent-core" }
flowy-automation = { path = "crates/flowy-automation" }
uuid = { version = "1.29.2", features = ["v7"] }
rpi-agent = { git = "https://github.com/bigfish1913/pi-rust", rev = "300c1f3b560b653b812a8877956dc1a1776629b7" }
rpi-ai = { git = "https://github.com/bigfish1913/pi-rust", rev = "300c1f3b560b653b812a8877956dc1a1776629b7", default-features = false, features = ["providers"] }
rpi-tools = { git = "https://github.com/bigfish1913/pi-rust", rev = "300c1f3b560b653b812a8877956dc1a1776629b7" }
flowy-i18n = { path = "crates/flowy-i18n" }
flowy-ui = { path = "crates/flowy-ui" }
flowy-shell = { path = "crates/flowy-shell" }
flowy-studio = { path = "crates/flowy-studio" }
flowy-net = { path = "crates/flowy-net" }
flowy-ota = { path = "crates/flowy-ota" }
flowy-obs = { path = "crates/flowy-obs" }
flowy-skills = { path = "crates/flowy-skills" }
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
    "socks",
] }
directories = "6"
getrandom = "0.3"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "json",
    "registry",
] }
sentry = { version = "0.38", default-features = false, features = [
    "backtrace",
    "contexts",
    "panic",
    "reqwest",
    "rustls",
] }
sentry-tracing = "0.38"
gpui = { package = "gpui-pre", version = "=0.3.14", features = ["hot-reload"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.14" }
gpui-kit = "=0.11.0"
# The default `gpui` feature pulls in `gpui 0.2.2`, a different type graph.
# `gpui-kit` is this crate's alias for `gpui-pre`, which must stay the same
# version as the workspace's.
gpui-tray = { version = "0.3.0", default-features = false, features = [
    "gpui-kit",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rustix = { version = "1.1.6", features = ["fs"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

# Lint gates follow omatrack's policy: the checks that catch real defects are
# errors, and every deliberate omission is written down instead of silently
# tolerated. Run them through `cargo clippy --all-targets -- -D warnings`.
[workspace.lints.rust]
unsafe_code = "deny"
unused_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Deliberate omissions. Each one is a place where the pedantic default would
# force a rewrite that makes the code less direct without making it safer.
#   module_name_repetitions    - `canvas::CanvasState` reads better than
#                                inventing a second vocabulary for one concept.
#   missing_errors_doc         - this is an application; its error types are
#   missing_panics_doc           reachable from the caller in one screen.
#   must_use_candidate         - noise on small private helpers.
#   struct_excessive_bools     - view options are bool flags by nature.
#   cast_precision_loss        - logical pixels are f32 by definition.
#   cast_possible_truncation     Layout math is bounded by the viewport and the
#   cast_sign_loss               document bounds; explicit `as` is clearer than
#                                a chain of fallible conversions.
#   similar_names              - (x, y), (w, h), (from, to).
#   too_many_lines             - render functions are linear on purpose.
#   option_if_let_else         - `if let` keeps ownership visible.
#   multiple_crate_versions    - the dependency graph is not ours to fix.
#   cast_lossless              - explicit `as` in layout math is clearer than
#                                From chains.
#   needless_pass_by_value     - gpui element builders take ownership.
#   items_after_statements     - small lookup tables live next to their use.
#   float_cmp                  - document coordinates are user-authored values
#                                and dirty checking is intentionally exact.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
similar_names = "allow"
too_many_lines = "allow"
option_if_let_else = "allow"
multiple_crate_versions = "allow"
needless_pass_by_value = "allow"
items_after_statements = "allow"
float_cmp = "allow"

[profile.dev]
debug = "line-tables-only"
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.test]
debug = false
opt-level = 0

[profile.test.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true

# gpui-pre-macros leaves a helper ungated in release builds while its module is
# gated on debug_assertions; enable it for the host proc-macro only.
[profile.release.package.gpui-pre-macros]
debug-assertions = true
