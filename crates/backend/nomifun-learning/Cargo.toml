[package]
name = "nomifun-learning"
description = "Domain-neutral learning engine over knowledge bases"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nomifun-api-types.workspace = true
nomifun-auth.workspace = true
nomifun-common.workspace = true
nomifun-db.workspace = true
nomifun-knowledge.workspace = true
nomifun-realtime.workspace = true
# 铸名门外部通行名证据（m11）：无 key 搜索缝（SearchProvider + DDG）。
# backend → flowy-web 直依赖先例 = nomifun-briefing（Cargo.toml 同款）。
flowy-web.workspace = true
async-trait.workspace = true
axum.workspace = true
chrono.workspace = true
fsrs.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
walkdir.workspace = true

[dev-dependencies]
tokio.workspace = true
nomifun-realtime.workspace = true
tempfile.workspace = true
# p2 生成级 warn 留痕断言（评审修复）：fmt Subscriber + SharedBuf 捕获生成门
# 的非拒绝 warnings 日志（与 nomifun-ai-agent acp.rs 同款捕获形状）。
tracing-subscriber.workspace = true
# kill-switch 测试改进程内 env(serial 互斥,防止与并行跑新管线的测试互扰)。
serial_test.workspace = true
# 路由层单测（g1 grow 模型选择）：Router::oneshot 走真实提取器栈。
tower = { workspace = true, features = ["util"] }
