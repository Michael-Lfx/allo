name: Release to ModelScope

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to rebuild and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: modelscope-alpha-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release-context:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$MANUAL_TAG"
          else
            tag="$PUSH_TAG"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Verify tag and workspace version
        id: release
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git_tag="$(git describe --tags --exact-match)"
          if [[ "$git_tag" != "$RELEASE_TAG" ]]; then
            echo "Checked-out tag $git_tag does not match requested tag $RELEASE_TAG" >&2
            exit 1
          fi

          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ -z "$version" || "v$version" != "$RELEASE_TAG" ]]; then
            echo "Tag $RELEASE_TAG does not match Cargo.toml version ${version:-<missing>}" >&2
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows updater
    needs: release-context
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-context.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw 'TAURI_SIGNING_PRIVATE_KEY is not configured'
          }
          bun run build:win --config apps/desktop/tauri.updater.conf.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run make:latest --host modelscope --channel alpha --collect
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Store Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: allo-updater-windows
          path: dist/desktop/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  build-macos:
    name: Build macOS updater
    needs: release-context
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-context.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "TAURI_SIGNING_PRIVATE_KEY is not configured" >&2
            exit 1
          }
          bun run build:mac --config apps/desktop/tauri.updater.conf.json
          bun run make:latest --host modelscope --channel alpha --collect

      - name: Store macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: allo-updater-macos
          path: dist/desktop/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  build-linux:
    name: Build Linux updater
    needs: release-context
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-context.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libpipewire-0.3-dev \
            libgbm-dev \
            libclang-dev \
            librsvg2-dev \
            xdg-utils

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "TAURI_SIGNING_PRIVATE_KEY is not configured" >&2
            exit 1
          }
          bun run build:linux --config apps/desktop/tauri.updater.conf.json
          bun run make:latest --host modelscope --channel alpha --collect

      - name: Store Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: allo-updater-linux
          path: dist/desktop/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  modelscope-upload:
    name: Publish ModelScope release
    needs:
      - release-context
      - build-windows
      - build-macos
      - build-linux
    runs-on: ubuntu-latest
    environment: modelscope-alpha
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-context.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ModelScope SDK
        run: python -m pip install modelscope

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Merge platform artifacts and manifests
        env:
          EXPECTED_VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          python - "$EXPECTED_VERSION" <<'PY'
          import json
          import shutil
          import sys
          from pathlib import Path

          expected = sys.argv[1]
          root = Path("release-artifacts")
          sources = [
              root / "allo-updater-windows",
              root / "allo-updater-macos",
              root / "allo-updater-linux",
          ]
          combined = root / "combined"
          combined.mkdir()

          merged = None
          for source in sources:
              manifest_path = source / "latest.json"
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              if str(manifest.get("version")) != expected:
                  raise SystemExit(
                      f"{manifest_path} has version {manifest.get('version')}, expected {expected}"
                  )

              if merged is None:
                  merged = {**manifest, "platforms": {}}
              for platform, entry in (manifest.get("platforms") or {}).items():
                  previous = merged["platforms"].get(platform)
                  if previous is not None and previous != entry:
                      raise SystemExit(f"conflicting manifest entries for {platform}")
                  merged["platforms"][platform] = entry

              for artifact in source.iterdir():
                  if artifact.is_file() and artifact.name not in {"latest.json", "alpha.yml"}:
                      destination = combined / artifact.name
                      if destination.exists() and destination.read_bytes() != artifact.read_bytes():
                          raise SystemExit(f"conflicting artifacts named {artifact.name}")
                      shutil.copy2(artifact, destination)

          required = {"windows-x86_64", "darwin-x86_64", "darwin-aarch64", "linux-x86_64"}
          actual = set(merged["platforms"])
          missing = sorted(required - actual)
          if missing:
              raise SystemExit(f"merged manifest is missing platforms: {', '.join(missing)}")

          (combined / "latest.json").write_text(
              json.dumps(merged, indent=2) + "\n", encoding="utf-8"
          )
          print("Merged platforms:", ", ".join(sorted(merged["platforms"])))
          PY

      - name: Publish release
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          test -n "$MODELSCOPE_TOKEN" || {
            echo "MODELSCOPE_TOKEN is not configured" >&2
            exit 1
          }
          bun scripts/run-upload-modelscope.mjs \
            --dist-dir release-artifacts/combined

      - name: Verify published manifest
        env:
          EXPECTED_VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          manifest_url='https://modelscope.cn/api/v1/models/flowy2025/flowyaipc/repo?Revision=master&FilePath=allo/channels/alpha/latest.json'
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error "$manifest_url" -o published-latest.json && \
              python - "$EXPECTED_VERSION" <<'PY'
          import json
          import sys

          expected = sys.argv[1]
          with open("published-latest.json", encoding="utf-8") as handle:
              manifest = json.load(handle)

          required = {"windows-x86_64", "darwin-x86_64", "darwin-aarch64", "linux-x86_64"}
          actual = set(manifest.get("platforms") or {})
          if str(manifest.get("version")) != expected:
              raise SystemExit(f"expected version {expected}, got {manifest.get('version')}")
          missing = sorted(required - actual)
          if missing:
              raise SystemExit(f"published manifest is missing platforms: {', '.join(missing)}")
          PY
            then
              exit 0
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "Published manifest did not pass verification" >&2
              exit 1
            fi
            sleep 10
          done
