# Deprecated: shared alpha channel pointer

The shared ModelScope channel `allo/channels/alpha/latest.json` is deprecated.
OTA now uses independent platform channels:

- `allo/channels/windows/latest.json`
- `allo/channels/macos/latest.json`
- `allo/channels/linux/latest.json`

See `channel.windows.yml` / `channel.macos.yml` / `channel.linux.yml` generated
by `bun run make:latest --host modelscope --channel <platform>`.
