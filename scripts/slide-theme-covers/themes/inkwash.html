<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Ma+Shan+Zheng&display=block">
<link rel="stylesheet" href="../base.css">
<style>
  .slide { background: #F4EFE4; color: #1F1F1F; font-family: 'Cormorant Garamond', serif; }
  .grain { inset: 0; opacity: .5; mix-blend-mode: multiply; }
  h1 { left: 120px; top: 176px; font-size: 104px; font-weight: 600; line-height: .98; letter-spacing: -0.01em; }
  h1 i { font-weight: 500; }
  .sub { left: 124px; top: 418px; width: 420px; font-size: 26px; font-style: italic; line-height: 1.4; color: rgba(31,31,31,.7); }
  .hair { left: 124px; top: 136px; width: 120px; height: 1px; background: #1F1F1F; opacity: .5; }
  .kicker { left: 124px; top: 104px; font-size: 16px; letter-spacing: .3em; color: rgba(31,31,31,.7); }
  .seal { left: 1110px; top: 470px; width: 84px; height: 84px; background: #B22222; border-radius: 6px; color: #F4EFE4; font-family: 'Ma Shan Zheng', serif; font-size: 36px; line-height: 38px; display: grid; grid-template-columns: 1fr 1fr; place-items: center; padding: 4px; transform: rotate(-2deg); }
  .vert { left: 1196px; top: 96px; writing-mode: vertical-rl; font-size: 17px; letter-spacing: .3em; color: rgba(31,31,31,.6); }
</style>
</head>
<body>
<main class="slide">
  <svg class="abs" style="left:0;top:0" width="1280" height="720">
    <defs>
      <filter id="brush" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="4"/>
        <feDisplacementMap in="SourceGraphic" scale="18"/>
        <feGaussianBlur stdDeviation="0.6"/>
      </filter>
      <filter id="wash"><feGaussianBlur stdDeviation="10"/></filter>
      <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3A3A3A" stop-opacity=".5"/><stop offset="1" stop-color="#3A3A3A" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="M520 720 C600 610 700 560 780 590 C850 615 900 540 980 520 C1060 500 1140 560 1280 520 L1280 720 Z" fill="url(#hill)" filter="url(#wash)" opacity=".7"/>
    <path d="M680 720 C760 650 860 640 940 660 C1020 680 1100 620 1280 640 L1280 720 Z" fill="url(#hill)" filter="url(#wash)"/>
    <path d="M1010 128 A178 178 0 1 0 1110 168" fill="none" stroke="#1F1F1F" stroke-width="30" stroke-linecap="round" filter="url(#brush)" opacity=".18"/>
    <path d="M1010 128 A178 178 0 1 0 1110 168" fill="none" stroke="#1F1F1F" stroke-width="16" stroke-linecap="round" filter="url(#brush)" opacity=".85"/>
    <path d="M124 520 C 200 512, 300 516, 380 508" fill="none" stroke="#1F1F1F" stroke-width="5" stroke-linecap="round" filter="url(#brush)" opacity=".7"/>
  </svg>
  <svg class="grain" width="1280" height="720"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2"/><feColorMatrix values="0 0 0 0 .35  0 0 0 0 .3  0 0 0 0 .25  0 0 0 .18 0"/></filter><rect width="1280" height="720" filter="url(#n)"/></svg>
  <div class="kicker">EXHIBITION</div>
  <div class="hair"></div>
  <h1>The Art<br>of <i>Stillness</i></h1>
  <p class="sub">A meditation on space, silence and the beauty of what is left unsaid.</p>
  <div class="seal"><span>静</span><span>观</span><span>自</span><span>得</span></div>
  <div class="vert">SPRING · 2026 · SUZHOU</div>
</main>
</body>
</html>
