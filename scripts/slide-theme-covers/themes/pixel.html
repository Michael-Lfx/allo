<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen&display=block">
<link rel="stylesheet" href="../base.css">
<style>
  .slide { background: #1D1F33; color: #FFFFFF; font-family: 'Silkscreen', monospace; }
  .px { font-family: 'Press Start 2P', monospace; }
  .hud { left: 64px; right: 64px; top: 48px; display: flex; justify-content: space-between; font-size: 18px; }
  .hud span b { color: #FFE66D; font-weight: 400; }
  .hp { left: 64px; top: 92px; display: flex; gap: 4px; }
  .hp i { width: 24px; height: 16px; background: #FF6B6B; }
  .hp i.off { background: #3A3D5C; }
  h1 { left: 64px; top: 196px; font-size: 76px; line-height: 1.2; text-shadow: 6px 6px 0 #FF6B6B; }
  .sub { left: 68px; top: 418px; font-size: 26px; color: #4ECDC4; }
  .start { left: 68px; top: 478px; font-size: 20px; color: #FFE66D; }
  .ground { left: 0; right: 0; bottom: 0; height: 96px; background-image: linear-gradient(90deg, #4ECDC4 50%, #36A89F 50%); background-size: 64px 32px; border-top: 8px solid #FFE66D; }
  .ground2 { left: 0; right: 0; bottom: 0; height: 64px; background-image: linear-gradient(90deg, #2A2D48 50%, #23263D 50%), linear-gradient(#000 0 0); background-size: 64px 32px; background-position: 32px 0; }
  .br { width: 24px; height: 24px; border: 0 solid #FFFFFF; opacity: .7; }
</style>
</head>
<body>
<main class="slide">
  <svg class="abs" style="left:0;top:0" width="1280" height="720" shape-rendering="crispEdges">
    <g fill="#FFE66D"><rect x="520" y="120" width="8" height="8"/><rect x="680" y="200" width="8" height="8"/><rect x="1190" y="140" width="8" height="8"/><rect x="760" y="90" width="8" height="8"/><rect x="1100" y="420" width="8" height="8"/><rect x="600" y="380" width="8" height="8"/></g>
    <g id="heart" transform="translate(860 170)"></g>
  </svg>
  <div class="hud px"><span>1UP <b>004200</b></span><span>HI <b>099999</b></span><span>LV <b>03</b></span></div>
  <div class="hp"><i></i><i></i><i></i><i></i><i class="off"></i></div>
  <h1 class="px">GAME<br>NIGHT</h1>
  <p class="sub">LEVEL UP TOGETHER · FRI 19:00</p>
  <p class="start px">▶ PRESS START</p>
  <div class="ground2"></div>
  <div class="ground" style="bottom:64px;height:32px"></div>
  <script>
    const rows = ['..XXX...XXX..', '.XXHHX.XXXXX.', 'XXHHXXXXXXXXX', 'XXHXXXXXXXXXX', 'XXXXXXXXXXXXX', '.XXXXXXXXXXX.', '..XXXXXXXXX..', '...XXXXXXX...', '....XXXXX....', '.....XXX.....', '......X......'];
    const g = document.getElementById('heart');
    const S = 24;
    rows.forEach((row, r) => [...row].forEach((c, k) => {
      if (c === '.') return;
      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', k * S); rect.setAttribute('y', r * S); rect.setAttribute('width', S); rect.setAttribute('height', S);
      const edge = r === rows.length - 1 || rows[r + 1][k] === '.' ;
      rect.setAttribute('fill', c === 'H' ? '#FFFFFF' : edge ? '#C94848' : '#FF6B6B');
      g.appendChild(rect);
    }));
  </script>
</main>
</body>
</html>
